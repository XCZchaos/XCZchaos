<svg xmlns="http://www.w3.org/2000/svg" width="820" height="245" viewBox="0 0 820 245" role="img" aria-labelledby="title desc">
  <title id="title">NeuroFlow featured project</title>
  <desc id="desc">A self-hosted animated project card for the NeuroFlow open-source repository.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="0.58" stop-color="#111C2C"/>
      <stop offset="1" stop-color="#171530"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#00E6B8"/>
      <stop offset="0.52" stop-color="#1677FF"/>
      <stop offset="1" stop-color="#845EF7"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="818" height="243" rx="22" fill="url(#bg)" stroke="#2A3D5B"/>
  <rect x="1" y="1" width="818" height="5" rx="2.5" fill="url(#accent)"/>

  <g transform="translate(55 53)">
    <circle cx="52" cy="70" r="50" fill="#101B2C" stroke="url(#accent)" stroke-width="2.5" filter="url(#glow)">
      <animate attributeName="stroke-width" values="2;5;2" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <path d="M16 70h15l8-24 15 49 13-67 14 60 10-18h18" fill="none" stroke="#38E8C6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6">
      <animate attributeName="stroke-dashoffset" from="0" to="-84" dur="2.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="190" y="66" fill="#38E8C6" font-size="13" letter-spacing="2">FEATURED OPEN-SOURCE PROJECT</text>
    <text x="190" y="108" fill="#F1F5F9" font-size="34" font-weight="700">NeuroFlow</text>
    <text x="190" y="137" fill="#9BA8BE" font-size="15">Intelligent neural signal workspace</text>

    <g font-size="12" font-weight="600">
      <rect x="190" y="164" width="67" height="27" rx="13.5" fill="#102C2A" stroke="#1B6158"/>
      <text x="223.5" y="182" fill="#38E8C6" text-anchor="middle">GO</text>
      <rect x="268" y="164" width="91" height="27" rx="13.5" fill="#10243D" stroke="#214F7D"/>
      <text x="313.5" y="182" fill="#69AEFF" text-anchor="middle">PYTHON</text>
      <rect x="370" y="164" width="83" height="27" rx="13.5" fill="#211B3B" stroke="#554497"/>
      <text x="411.5" y="182" fill="#B39AFB" text-anchor="middle">AGENTS</text>
      <rect x="464" y="164" width="102" height="27" rx="13.5" fill="#242315" stroke="#6D6626"/>
      <text x="515" y="182" fill="#E7D95D" text-anchor="middle">LOCAL-FIRST</text>
    </g>

    <text x="190" y="220" fill="#66758D" font-size="12">signal → deterministic tool → Agent → explainable insight</text>
  </g>

  <g transform="translate(718 116)" filter="url(#glow)">
    <circle r="5" fill="#00E6B8">
      <animate attributeName="r" values="4;9;4" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;.35;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="19" fill="none" stroke="#1677FF" stroke-width="1.5" stroke-dasharray="4 6">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
